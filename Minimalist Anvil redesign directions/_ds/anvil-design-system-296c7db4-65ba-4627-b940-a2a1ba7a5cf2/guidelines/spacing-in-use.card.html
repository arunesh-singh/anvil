<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0}.k{flex:0 0 170px;font:var(--mono-small);color:var(--anvil-muted)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="background:var(--anvil-bg);border-radius:var(--radius-panel);padding:20px;border:1px dashed var(--anvil-faint)">
<div style="font:var(--mono-small);color:var(--anvil-accent-text);margin-bottom:8px">20px screen padding</div>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="background:var(--anvil-container);border-radius:var(--radius-panel);padding:16px;font:var(--mono-small);color:var(--anvil-muted)">panel · 16px padding · 22px radius</div>
<div style="display:flex;gap:8px"><div style="flex:1;height:48px;background:var(--anvil-container);border-radius:var(--radius-control)"></div><div style="flex:1;height:48px;background:var(--anvil-container);border-radius:var(--radius-control)"></div><div style="font:var(--mono-small);color:var(--anvil-muted);align-self:center">8px between controls</div></div>
<div style="height:60px;background:var(--anvil-accent);border-radius:var(--radius-button);display:flex;align-items:center;justify-content:center;color:#fff;font:var(--label-large)">Run</div>
<div style="font:var(--mono-small);color:var(--anvil-muted)">60px action height · 14px stack gap</div>
</div></div></body></html>
