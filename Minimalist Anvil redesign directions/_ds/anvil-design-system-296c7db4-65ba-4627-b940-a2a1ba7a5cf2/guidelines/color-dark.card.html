<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div data-theme="dark" style="background:#16171a;border-radius:var(--radius-panel);padding:16px">

<div style="font:var(--body-medium);color:#8b9099;margin-top:12px">The accent does not shift between schemes; only its text variant lightens to #8FA0FF for contrast on dark containers.</div>
