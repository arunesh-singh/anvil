<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0}.k{flex:0 0 170px;font:var(--mono-small);color:var(--anvil-muted)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div class="r"><div class="k">headline-large<br>700 34/38</div><div style="font:var(--headline-large);letter-spacing:var(--headline-large-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Merge PDFs</div></div><div class="r"><div class="k">headline-medium<br>700 30/34</div><div style="font:var(--headline-medium);letter-spacing:var(--headline-medium-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Merge PDFs</div></div><div class="r"><div class="k">headline-small<br>700 25/30</div><div style="font:var(--headline-small);letter-spacing:var(--headline-small-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Merge PDFs</div></div><div style="font:var(--body-medium);color:var(--anvil-muted);margin-top:8px">headline-medium is the tool-screen title and the number inside the progress ring. headline-large is unused.</div></body></html>
