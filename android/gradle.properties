org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP 9 flipped this to true: a kept class no longer implicitly keeps its
# default constructor. Every ML Kit AAR (text recognition, segmentation,
# labeling, translate) still ships AGP-8-era consumer keep rules, so in a
# minified release build its reflective instantiation returns null and the
# first call NPEs inside the shaded internals — seen as
# "Text recognition failed: PlatformException(... getClass() on a null object
# reference)" from image/to-text. Same breakage is reported for MediaPipe/
# barcode (googlesamples/mlkit#1001, #1007). Restore the AGP 8.13 semantics
# until those libraries ship strict-mode-compatible rules.
android.r8.strictFullModeForKeepRules=false
