<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:flex;gap:16px;align-items:stretch">
<div style="flex:0 0 210px;border-radius:var(--radius-panel);background:var(--anvil-accent);color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between"><span class="lbl" style="color:rgba(255,255,255,.85);margin:0">accent</span><span style="font:var(--title-large);letter-spacing:var(--title-large-tracking)">#4D67FF</span></div>
<div style="display:flex;flex:1;gap:8px"><div style="flex:1;min-width:0"><div class="sw" style="background:#e1e5ff;color:#3346d6">accent container</div><div class="cap">#E1E5FF</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#3346d6;color:#fff">accent text</div><div class="cap">#3346D6</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#242a45;color:#8fa0ff">container · dark</div><div class="cap">#242A45</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#8fa0ff;color:#16171a">accent text · dark</div><div class="cap">#8FA0FF</div></div></div>
</div>
<div style="font:var(--body-medium);color:var(--anvil-muted);margin-top:12px">One accent, used for the primary action, the selected state and progress. Everything else is neutral. There is no secondary or tertiary hue.</div>
</body></html>
