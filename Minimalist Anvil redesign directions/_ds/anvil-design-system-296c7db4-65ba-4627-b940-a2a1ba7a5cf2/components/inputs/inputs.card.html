<!-- @dsCard group="Components" viewport="700x300" name="Inputs" subtitle="Filled field, segmented mode switch, integer stepper, theme radios" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;background:var(--anvil-bg);color:var(--anvil-on-surface);font-family:var(--font-sans)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.cols{display:flex;gap:20px;align-items:flex-start}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { TextField, SegmentedControl, StepperField, RadioTile } = window.AnvilDesignSystem_296c7d;
function Demo(){const [m,setM]=React.useState('optimize');const [q,setQ]=React.useState(60);const [t,setT]=React.useState('system');
return (<div className="cols">
<div style={{flex:1,display:'flex',flexDirection:'column',gap:'12px'}}>
<div><div className="lbl">FIELD</div><TextField prefixIcon="search" hint="Search tools"/></div>
<TextField label="Pages to delete (e.g. 2,4-6)" defaultValue="2,4-6"/>
<div><div className="lbl">METHOD</div><SegmentedControl options={[{value:'optimize',label:'Optimize'},{value:'raster',label:'Rasterize'}]} value={m} onChange={setM}/></div>
</div>
<div style={{flex:1,display:'flex',flexDirection:'column',gap:'12px'}}>
<div><div className="lbl">STEPPER</div><StepperField label="Image quality (1-100)" value={q} min={10} max={95} step={5} onChange={setQ} helperText="Lower quality, smaller file."/></div>
<div><div className="lbl">RADIOS</div>
{['system','light','dark'].map(v=><RadioTile key={v} label={v[0].toUpperCase()+v.slice(1)} value={v} selected={t===v} onSelect={setT}/>)}
</div></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
