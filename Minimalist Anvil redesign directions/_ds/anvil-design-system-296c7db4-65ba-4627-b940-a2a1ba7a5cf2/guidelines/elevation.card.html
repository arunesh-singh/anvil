<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:flex;gap:12px;align-items:center">

</div>
<div style="font:var(--body-medium);color:var(--anvil-muted);margin-top:14px">The only dark overlay in the system is the modal scrim behind the page-zoom viewer. <code style="font:var(--mono-small)">--elevation-1…5</code> resolve to <code style="font:var(--mono-small)">none</code>.</div>
</body></html>
