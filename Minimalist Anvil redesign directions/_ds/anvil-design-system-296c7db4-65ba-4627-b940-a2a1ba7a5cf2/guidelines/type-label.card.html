<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0}.k{flex:0 0 170px;font:var(--mono-small);color:var(--anvil-muted)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div class="r"><div class="k">label-large<br>600 16/20</div><div style="font:var(--label-large);letter-spacing:var(--label-large-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Run</div></div><div class="r"><div class="k">label-medium<br>600 12/16</div><div style="font:var(--label-medium);letter-spacing:var(--label-medium-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Pages to delete</div></div><div class="r"><div class="k">label-small<br>600 11/14</div><div style="font:var(--label-small);letter-spacing:var(--label-small-tracking);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">OUTPUT</div></div><div style="font:var(--body-medium);color:var(--anvil-muted);margin-top:8px">label-small is the section eyebrow — the only place Anvil sets type in uppercase.</div></body></html>
