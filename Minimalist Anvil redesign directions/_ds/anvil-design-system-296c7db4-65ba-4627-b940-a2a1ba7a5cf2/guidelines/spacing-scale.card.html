<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.r{display:flex;align-items:baseline;gap:16px;padding:6px 0}.k{flex:0 0 170px;font:var(--mono-small);color:var(--anvil-muted)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end">
<div style="text-align:center"><div style="width:4px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:64px;background:var(--anvil-accent);border-radius:4px"></div><div style="font:var(--mono-small);color:var(--anvil-muted);margin-top:6px">24</div></div>
<div style="flex:1;font:var(--body-medium);color:var(--anvil-muted);padding-left:12px">20px is the screen gutter, 16px the panel padding, 14px the default stack gap, 10px the thumbnail-grid gutter, 8px the gap between controls.</div>
</div></body></html>
