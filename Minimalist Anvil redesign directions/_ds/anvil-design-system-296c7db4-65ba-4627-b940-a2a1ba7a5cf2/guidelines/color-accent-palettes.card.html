<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:flex;gap:8px"><div style="flex:1;min-width:0"><div class="sw" style="background:#1a1b1e;color:#fff">on surface · body</div><div class="cap">#1A1B1E</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#565a61;color:#fff">muted · secondary</div><div class="cap">#565A61</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#83888f;color:#fff">hint · placeholder</div><div class="cap">#83888F</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#a8acb3;color:#1a1b1e">faint · disabled</div><div class="cap">#A8ACB3</div></div><div style="flex:1;min-width:0"><div class="sw" style="background:#ba1a1a;color:#fff">error</div><div class="cap">#BA1A1A</div></div></div>
