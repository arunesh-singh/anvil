<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Three levels — page, container, raised. Depth is tint, never shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:flex;gap:10px;align-items:stretch">
<div style="flex:1;background:var(--anvil-bg);border-radius:var(--radius-panel);padding:12px"><div class="lbl">page · bg</div>
<div style="background:var(--anvil-container);border-radius:var(--radius-row);padding:12px"><div class="lbl" style="margin-bottom:6px">panel · container</div>
<div style="background:var(--anvil-container-high);border-radius:var(--radius-control);padding:12px"><div class="lbl" style="margin:0">raised · container high</div></div></div></div>
<div style="flex:1;background:#16171a;border-radius:var(--radius-panel);padding:12px" data-theme="dark"><div class="lbl">page · bg</div>
<div style="background:#1f2126;border-radius:var(--radius-row);padding:12px"><div class="lbl" style="margin-bottom:6px">panel · container</div>
<div style="background:#2c2f35;border-radius:var(--radius-control);padding:12px"><div class="lbl" style="margin:0">raised · container high</div></div></div></div>
</div></body></html>
