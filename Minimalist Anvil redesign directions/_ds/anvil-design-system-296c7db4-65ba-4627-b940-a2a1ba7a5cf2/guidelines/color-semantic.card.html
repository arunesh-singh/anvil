<!-- @dsCard group="Colors" viewport="700x200" name="Roles in use" subtitle="The fifteen AnvilColors roles, as the screens consume them" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-sans);background:var(--anvil-bg);color:var(--anvil-on-surface)}.lbl{font:var(--label-small);letter-spacing:1px;text-transform:uppercase;color:var(--anvil-muted);margin-bottom:8px}.sw{flex:1;min-width:0;border-radius:var(--radius-control);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--label-small)}.cap{font:var(--mono-small);color:var(--anvil-muted);padding:4px 2px}a{color:var(--anvil-accent-text)}a:hover{color:var(--anvil-accent)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="background:var(--anvil-container);border-radius:var(--radius-panel);padding:16px"><div class="lbl">panel · container</div><div style="font:var(--title-small)">Merge PDFs<span style="display:block;font:var(--body-medium);color:var(--anvil-muted)">Combine several PDF files into one document.</span></div></div>
<div style="background:var(--anvil-container);border-radius:var(--radius-panel);padding:16px;display:flex;gap:12px;align-items:center"><span style="width:40px;height:40px;border-radius:var(--radius-control);background:var(--anvil-accent-container);color:var(--anvil-accent-text);display:flex;align-items:center;justify-content:center;font-family:var(--font-icons);font-size:20px">merge</span><div style="font:var(--body-medium);color:var(--anvil-muted)">icon chip · accent container + accent text</div></div>
<div style="height:60px;border-radius:var(--radius-button);background:var(--anvil-accent);color:var(--anvil-on-accent);display:flex;align-items:center;justify-content:center;font:var(--label-large)">Run</div>
<div style="height:60px;border-radius:var(--radius-button);background:var(--anvil-container-high);color:var(--anvil-hint);display:flex;align-items:center;justify-content:center;font:var(--label-large)">Run · disabled</div>
<div style="background:var(--anvil-info);border-radius:var(--radius-panel);padding:14px;font:var(--body-medium);color:var(--anvil-muted)">info surface — offline and privacy notes</div>
<div style="background:var(--anvil-container);border-radius:var(--radius-panel);padding:14px;font:var(--body-medium);color:var(--anvil-error)">Enter a password.</div>
</div></body></html>
